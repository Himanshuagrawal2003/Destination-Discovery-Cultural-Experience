<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="48" height="48" rx="12" fill="url(#grad)"/>
  <!-- Globe circle outline -->
  <circle cx="24" cy="22" r="12" stroke="white" stroke-width="2" fill="none" opacity="0.95"/>
  <!-- Horizontal equator line -->
  <ellipse cx="24" cy="22" rx="12" ry="5" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Vertical meridian -->
  <line x1="24" y1="10" x2="24" y2="34" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <!-- Compass needle / pin -->
  <circle cx="24" cy="22" r="2.5" fill="white"/>
  <!-- Map pin drop -->
  <path d="M24 28 L24 38" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="39.5" r="1.5" fill="white" opacity="0.6"/>
</svg>